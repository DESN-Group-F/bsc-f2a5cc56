<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f8" />
    <title>Battery Inventory</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f5f6f8; }
      #root { height: 100dvh; }
      [data-initial-startup] { display: flex; flex-direction: column; height: 100%; overflow: hidden; color: #1c2433; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      [data-initial-startup] * { box-sizing: border-box; }
      [data-initial-startup] .phone-startup { flex: 1; min-height: 0; overflow: auto; width: 100%; max-width: 480px; margin-inline: auto; padding: calc(env(safe-area-inset-top) + 24px) max(24px, env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-right)); display: flex; flex-direction: column; justify-content: center; }
      [data-initial-startup] .phone-startup-identity { width: 56px; height: 56px; border-radius: 18px; background: #e7f0ff; color: #075dcc; display: grid; place-items: center; margin-bottom: 16px; flex: none; }
      [data-initial-startup] .phone-eyebrow { font-size: .75rem; line-height: 1.5; color: #526075; margin: 0; }
      [data-initial-startup] .phone-startup-status h1 { font-size: 1.75rem; line-height: 1.2; letter-spacing: -.5px; margin: 8px 0 12px; font-weight: 650; }
      [data-initial-startup] .phone-startup-status p { font-size: .875rem; line-height: 1.55; color: #526075; margin: 8px 0; }
      [data-initial-startup] .phone-startup-progress { display: block; height: 3px; width: 100%; background: #dce6f4; border-radius: 4px; overflow: hidden; margin-top: 24px; }
      [data-initial-startup] .phone-startup-progress i { display: block; height: 100%; width: 35%; background: #075dcc; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="phone-app" data-initial-startup>
        <section class="phone-startup" aria-busy="true" data-startup-phase="opening">
          <div class="phone-startup-identity" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M 22 14 L 22 10"></path><rect x="2" y="6" width="16" height="12" rx="2"></rect></svg></div>
          <p class="phone-eyebrow">Battery Inventory</p>
          <div class="phone-startup-status" role="status" aria-live="polite">
            <h1>Opening Battery Inventory</h1><p>Preparing this device.</p>
            <span class="phone-startup-progress" aria-hidden="true"><i></i></span>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
