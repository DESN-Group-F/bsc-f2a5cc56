# Manual testing milestone; only the selected workflow executes.
workflows:
  mobile-ios-verify:
    name: Mobile iOS compile check
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 22
      xcode: 26.6
    scripts:
      - name: Install the independent mobile package
        script: |
          set -euo pipefail
          cd mobile
          npm ci --no-fund --no-audit
      - name: Build the interface and check mobile logic
        script: |
          set -euo pipefail
          cd mobile
          npm run build
          npm test
          npm run test:plugin
          node ../scripts/prepare-mobile-native.mjs --ios
      - name: Compile for a physical iPhone without signing
        script: |
          set -euo pipefail
          cd mobile
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -destination 'generic/platform=iOS' -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - mobile/build/ios/Logs/**
      - mobile/build/ios/Build/Products/Debug-iphoneos/*.app
  mobile-android-debug:
    name: Mobile Android test package
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install and verify the mobile package
        script: |
          set -euo pipefail
          cd mobile
          npm ci --no-fund --no-audit
          npm run build
          npm test
          npm run test:plugin
          node ../scripts/prepare-mobile-native.mjs --android
      - name: Build an Android test package
        script: |
          set -euo pipefail
          cd mobile/android
          : "${ANDROID_SDK_ROOT:?The Android SDK path is required}"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - mobile/android/app/build/outputs/apk/debug/*.apk
  mobile-ios-testflight:
    name: Mobile iOS functional test beta
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: battery-inventory
    environment:
      node: 22
      xcode: 26.6
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.batteryinventory.mobile
    scripts:
      - name: Install and verify the mobile package
        script: |
          set -euo pipefail
          cd mobile
          npm ci --no-fund --no-audit
          npm run build
          npm test
          npm run test:plugin
          node ../scripts/prepare-mobile-native.mjs --ios
      - name: Apply provisioned NFC signing profiles
        script: |
          set -euo pipefail
          cd mobile
          xcode-project use-profiles
      - name: Set the build number and produce the signed package
        script: |
          set -euo pipefail
          cd mobile
          : "${PROJECT_BUILD_NUMBER:?A Codemagic project build number is required}"
          if [[ ! "$PROJECT_BUILD_NUMBER" =~ ^(0|[1-9][0-9]{0,8})$ ]]; then
            echo 'PROJECT_BUILD_NUMBER must be a bounded non-negative decimal integer.' >&2
            exit 1
          fi
          MOBILE_BUILD_NUMBER=$((PROJECT_BUILD_NUMBER + 1))
          if (( MOBILE_BUILD_NUMBER <= 13 )); then
            echo 'The assigned build number must exceed the latest confirmed App Store Connect upload (13).' >&2
            exit 1
          fi
          mkdir -p build/ios/verification
          printf '{"projectBuildNumber":%s,"assignedBuildNumber":%s,"minimumExclusive":13}\n' "$PROJECT_BUILD_NUMBER" "$MOBILE_BUILD_NUMBER" > build/ios/verification/build-number.json
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $MOBILE_BUILD_NUMBER" ios/App/App/Info.plist
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App \
            --archive-directory build/ios/xcarchive --ipa-directory build/ios/ipa
      - name: Verify signed package and crash-symbol identity before publishing
        script: |
          set -euo pipefail
          cd mobile
          python3 ../scripts/verify-ios-signed-artifact.py
          # Only a fully verified IPA becomes an artifact available to the publisher.
          mkdir build/ios/verified-ipa
          cp build/ios/ipa/*.ipa build/ios/verified-ipa/BatteryInventory.ipa.pending
          mv build/ios/verified-ipa/BatteryInventory.ipa.pending build/ios/verified-ipa/BatteryInventory.ipa
    artifacts:
      - mobile/build/ios/verified-ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - mobile/build/ios/xcarchive/**/*.dSYM
      - mobile/build/ios/verification/*.json
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
