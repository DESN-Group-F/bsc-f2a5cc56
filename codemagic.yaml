# Native iOS client. All workflows are started manually.
workflows:
  ios-native-check:
    name: iOS native · compile and screenshots
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 26.6
    scripts:
      - name: Generate the Xcode project
        script: |
          set -euo pipefail
          brew install xcodegen >/dev/null
          cd ios-native
          mkdir -p Support
          xcodegen generate
      - name: Install the Metal shader compiler
        script: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if xcodebuild -downloadComponent MetalToolchain; then break; fi
            echo "Download attempt $attempt failed; retrying"; sleep 10
          done
          xcodebuild -showComponent MetalToolchain || true
      - name: Compile for the simulator
        script: |
          cd ios-native
          set -o pipefail
          xcodebuild -project BatteryInventory.xcodeproj -scheme BatteryInventory -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          grep -E "error:|warning: .*(deprecated|unavailable)" build.log | sort -u > diagnostics.txt || true
          tail -5 build.log
          ERRORS=$(grep -c 'error:' diagnostics.txt || true)
          echo "errors: $ERRORS"
          if [ "$ERRORS" != "0" ]; then
            echo "---- diagnostics ----"
            head -60 diagnostics.txt
            echo "---- context ----"
            grep -n -B3 -A12 -E "error:|Undefined symbols|ld: " build.log | head -200
            exit 1
          fi
      - name: Capture preview screens
        script: |
          set -euo pipefail
          cd ios-native
          APP=build/Build/Products/Debug-iphonesimulator/BatteryInventory.app
          if [ ! -d "$APP" ]; then echo "Build failed; see diagnostics.txt"; exit 1; fi
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, items in devices.items() if "iOS" in runtime for d in items if d["name"].startswith("iPhone")]
          preferred = [d for d in phones if d["name"].endswith("Pro") or d["name"] in ("iPhone 17", "iPhone 16")]
          print((preferred or phones)[-1]["udid"])')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          LIGHT="registerModels register scan scanRegisterEmpty"
          DARK="registerModels scan"
          for appearance in light dark; do
            xcrun simctl ui "$UDID" appearance "$appearance"
            if [ "$appearance" = light ]; then SCREENS="$LIGHT"; else SCREENS="$DARK"; fi
            for screen in $SCREENS; do
              xcrun simctl launch --terminate-running-process "$UDID" com.batteryinventory.mobile -uiPreview "$screen" >/dev/null
              sleep 4
              xcrun simctl io "$UDID" screenshot "screenshots/${appearance}-${screen}.png" >/dev/null
            done
          done
          # Largest accessibility text size: layouts must reflow, not clip.
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl ui "$UDID" content_size accessibility-extra-extra-extra-large
          for screen in registerModels scan; do
            xcrun simctl launch --terminate-running-process "$UDID" com.batteryinventory.mobile -uiPreview "$screen" >/dev/null
            sleep 4
            xcrun simctl io "$UDID" screenshot "screenshots/ax-${screen}.png" >/dev/null
          done
          xcrun simctl ui "$UDID" content_size large || true
          # Motion strip: launch the auto-play demo and capture frames around each reaction.
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl launch --terminate-running-process "$UDID" com.batteryinventory.mobile -uiPreview inkMotion >/dev/null
          sleep 0.9
          for i in 01 02 03 04 05 06 07 08 09 10 11 12 13 14 15 16; do
            xcrun simctl io "$UDID" screenshot "screenshots/motion-$i.png" >/dev/null
            sleep 0.12
          done
          sleep 0.4
          for i in 17 18 19 20 21 22 23 24; do
            xcrun simctl io "$UDID" screenshot "screenshots/motion-$i.png" >/dev/null
            sleep 0.15
          done
          ls screenshots
      - name: Print screens 1 for review
        script: |
          set -uo pipefail
          cd ios-native/screenshots
          mkdir -p review
          for name in light-registerModels light-register light-scan; do
            f="$name.png"
            [ -f "$f" ] || { echo "missing $f"; continue; }
            case "$name" in motion-*) W=360 ;; *) W=520 ;; esac
            sips -s format jpeg -s formatOptions 72 --resampleWidth "$W" "$f" --out "review/$name.jpg" >/dev/null
            echo "@@IMG $name"
            base64 -i "review/$name.jpg" | tr -d '\n'
            echo
          done
          echo "@@END"
      - name: Print screens 2 for review
        script: |
          set -uo pipefail
          cd ios-native/screenshots
          mkdir -p review
          for name in light-scanRegisterEmpty dark-registerModels dark-scan; do
            f="$name.png"
            [ -f "$f" ] || { echo "missing $f"; continue; }
            case "$name" in motion-*) W=360 ;; *) W=520 ;; esac
            sips -s format jpeg -s formatOptions 72 --resampleWidth "$W" "$f" --out "review/$name.jpg" >/dev/null
            echo "@@IMG $name"
            base64 -i "review/$name.jpg" | tr -d '\n'
            echo
          done
          echo "@@END"
      - name: Print screens 3 for review
        script: |
          set -uo pipefail
          cd ios-native/screenshots
          mkdir -p review
          for name in ax-registerModels ax-scan; do
            f="$name.png"
            [ -f "$f" ] || { echo "missing $f"; continue; }
            case "$name" in motion-*) W=360 ;; *) W=520 ;; esac
            sips -s format jpeg -s formatOptions 72 --resampleWidth "$W" "$f" --out "review/$name.jpg" >/dev/null
            echo "@@IMG $name"
            base64 -i "review/$name.jpg" | tr -d '\n'
            echo
          done
          echo "@@END"
      - name: Print motion for review
        script: |
          set -uo pipefail
          cd ios-native/screenshots
          mkdir -p review
          for name in motion-01 motion-03 motion-05 motion-07 motion-09 motion-11 motion-13 motion-15 motion-17 motion-19 motion-21 motion-23; do
            f="$name.png"
            [ -f "$f" ] || { echo "missing $f"; continue; }
            case "$name" in motion-*) W=360 ;; *) W=520 ;; esac
            sips -s format jpeg -s formatOptions 72 --resampleWidth "$W" "$f" --out "review/$name.jpg" >/dev/null
            echo "@@IMG $name"
            base64 -i "review/$name.jpg" | tr -d '\n'
            echo
          done
          echo "@@END"
    artifacts:
      - ios-native/build.log
      - ios-native/diagnostics.txt
      - ios-native/screenshots/*.png

  ios-native-testflight:
    name: iOS native · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: battery-inventory
    environment:
      xcode: 26.6
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.batteryinventory.mobile
    scripts:
      - name: Generate the Xcode project
        script: |
          set -euo pipefail
          brew install xcodegen >/dev/null
          cd ios-native
          mkdir -p Support
          xcodegen generate
      - name: Install the Metal shader compiler
        script: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if xcodebuild -downloadComponent MetalToolchain; then break; fi
            echo "Download attempt $attempt failed; retrying"; sleep 10
          done
          xcodebuild -showComponent MetalToolchain || true
      - name: Apply signing profiles
        script: |
          set -euo pipefail
          cd ios-native
          xcode-project use-profiles --project BatteryInventory.xcodeproj
      - name: Build number above the last upload (14)
        script: |
          set -euo pipefail
          cd ios-native
          : "${PROJECT_BUILD_NUMBER:?A Codemagic project build number is required}"
          NUMBER=$((PROJECT_BUILD_NUMBER + 1))
          if (( NUMBER <= 14 )); then NUMBER=$((NUMBER + 14)); fi
          echo "Build number: $NUMBER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NUMBER" Support/Info.plist
      - name: Build the signed package
        script: |
          set -euo pipefail
          cd ios-native
          xcode-project build-ipa --project BatteryInventory.xcodeproj --scheme BatteryInventory \
            --archive-directory build/xcarchive --ipa-directory build/ipa
    artifacts:
      - ios-native/build/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios-native/build/xcarchive/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
