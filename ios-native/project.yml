name: BatteryInventory
options:
  bundleIdPrefix: com.batteryinventory
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.1"
    CURRENT_PROJECT_VERSION: "15"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  BatteryInventory:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Battery Inventory
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NFCReaderUsageDescription: Reads battery tags so you can check batteries out, return them and look them up.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: Support/BatteryInventory.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats:
          - TAG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batteryinventory.mobile
        PRODUCT_NAME: BatteryInventory
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
schemes:
  BatteryInventory:
    build:
      targets:
        BatteryInventory: all
    run:
      config: Debug
    archive:
      config: Release
